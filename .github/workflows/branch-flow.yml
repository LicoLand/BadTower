name: Branch flow

on:
  push:
    branches: ["nightly", "stable", "release"]
  pull_request:
    branches: ["nightly", "stable", "release"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: branch-flow-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-flow:
    name: Branch flow policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Verify branch flow fixtures
        run: go test ./internal/branchflow
      - name: Verify branch flow
        run: go run ./cmd/verify-branch-flow
